# CI/CD Build for magnanix
#
# Two tiers:
#
# - Evaluate (every PR and every push to main): format check, flake.nix
#   up-to-date check, script lints and tests (test-scripts, on Linux and
#   macOS), and evaluation of every NixOS and nix-darwin host. Nothing
#   is built and no secrets are needed, so it takes a minute or two.
# - Build (pushes to main, the weekly update-flake-lock PR, a PR labelled
#   `ci:build`, or a manual run): builds every host's system closure and pushes
#   the results to muninn's Attic cache via Tailscale OIDC. If muninn can't be
#   reached, or drops out mid-build, the jobs build locally instead (`--fallback`)
#   and skip the push.
#     - aarch64-darwin: magnus, darwintron (macos-26)
#     - x86_64-linux: muninn, fortuna, nixostron-x86_64 (ubuntu-latest)
#     - aarch64-linux: nixostron-aarch64 (ubuntu-24.04-arm)
#
# Changes that only touch documentation skip the workflow entirely.
#
name: CI/CD Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "documentation/**"
      - "LICENSE"
  pull_request:
    # `labeled` lets adding `ci:build` start a full build of the PR
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - "**.md"
      - "documentation/**"
      - "LICENSE"
  workflow_dispatch:

# Adding a label other than ci:build gets its own group, so it doesn't cancel a
# run in progress (its own run skips every job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.action == 'labeled' && github.event.label.name || 'run' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Evaluate
  # ---------------------------------------------------------------------------

  # NixOS hosts are evaluated on Linux; fortuna imports from a derivation
  # (zen-browser's presets), which needs a runner of the host's own system.
  # nixostron-aarch64 doesn't, so it evaluates fine on x86_64.
  eval-linux:
    name: Evaluate NixOS hosts, formatting and flake.nix
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 -r nix fmt -- --check

      - name: Check flake.nix is up to date (nix run .#write-flake)
        run: nix build --no-link .#checks.x86_64-linux.check-flake-file

      - name: Lint and test shell and Python scripts (test-scripts)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.script-tests

      # Hosts are listed from the flake, so new ones are picked up automatically.
      - name: Evaluate NixOS hosts
        run: |
          # Listed into a variable first: a failing command substitution in a
          # `for` list doesn't stop `bash -e`, so an evaluation error would
          # leave nothing to loop over and the step would still pass.
          hosts_json=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames --accept-flake-config)
          hosts=$(jq -r '.[]' <<<"$hosts_json")
          if [ -z "$hosts" ]; then
            echo "::error::No hosts found in nixosConfigurations"
            exit 1
          fi
          for host in $hosts; do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" \
              --accept-flake-config
            echo
            echo "::endgroup::"
          done

  # magnus imports from a derivation (zen-browser's presets) built for
  # aarch64-darwin, so the darwin hosts can't be evaluated on Linux.
  eval-darwin:
    name: Evaluate nix-darwin hosts
    if: github.event.action != 'labeled' || github.event.label.name == 'ci:build'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      # Also on macOS, where the scripts meet BSD tools.
      - name: Lint and test shell and Python scripts (test-scripts)
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.script-tests

      - name: Evaluate nix-darwin hosts
        run: |
          # Listed into a variable first: a failing command substitution in a
          # `for` list doesn't stop `bash -e`, so an evaluation error would
          # leave nothing to loop over and the step would still pass.
          hosts_json=$(nix eval --json .#darwinConfigurations --apply builtins.attrNames --accept-flake-config)
          hosts=$(jq -r '.[]' <<<"$hosts_json")
          if [ -z "$hosts" ]; then
            echo "::error::No hosts found in darwinConfigurations"
            exit 1
          fi
          for host in $hosts; do
            echo "::group::$host"
            nix eval --raw ".#darwinConfigurations.$host.system.drvPath" \
              --accept-flake-config
            echo
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  # Decides once whether the build jobs run, so the condition lives in one place.
  should-build:
    name: Decide whether to build
    needs: [eval-linux, eval-darwin]
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:build') }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REF" = update-flake-lock ] || [ "$HAS_LABEL" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building: $EVENT, branch '$HEAD_REF', ci:build label: $HAS_LABEL"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Evaluation only. Add the ci:build label to build this PR."
          fi

  build-darwin:
    name: Build darwin (aarch64-darwin)
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12

      # Optional: if muninn is unreachable the job builds without the cache.
      - name: Use muninn's Attic cache
        id: attic
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build magnus
        run: |
          nix build .#darwinConfigurations.magnus.system \
            --out-link result-magnus \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build darwintron
        run: |
          nix build .#darwinConfigurations.darwintron.system \
            --out-link result-darwintron \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Push to Attic cache
        if: always() && steps.attic.outcome == 'success'
        run: attic push magnanix result-* || true

  build-linux-x86:
    name: Build linux (x86_64-linux)
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # Optional: if muninn is unreachable the job builds without the cache.
      - name: Use muninn's Attic cache
        id: attic
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build muninn
        run: |
          nix build .#nixosConfigurations.muninn.config.system.build.toplevel \
            --out-link result-muninn \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build fortuna
        run: |
          nix build .#nixosConfigurations.fortuna.config.system.build.toplevel \
            --out-link result-fortuna \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build nixostron-x86_64
        run: |
          nix build .#nixosConfigurations.nixostron-x86_64.config.system.build.toplevel \
            --out-link result-nixostron-x86_64 \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Push to Attic cache
        if: always() && steps.attic.outcome == 'success'
        run: attic push magnanix result-* || true

  build-linux-aarch64:
    name: Build linux (aarch64-linux)
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3

      # Optional: if muninn is unreachable the job builds without the cache.
      - name: Use muninn's Attic cache
        id: attic
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build nixostron-aarch64
        run: |
          nix build .#nixosConfigurations.nixostron-aarch64.config.system.build.toplevel \
            --out-link result-nixostron-aarch64 \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Push to Attic cache
        if: always() && steps.attic.outcome == 'success'
        run: attic push magnanix result-* || true
