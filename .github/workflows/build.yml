# CI/CD Build for magnanix
#
# Two tiers:
#
# - Evaluate (every PR and every push to main): format check, flake.nix
#   up-to-date check, script lints and tests (test-scripts, on Linux and
#   macOS), and evaluation of every NixOS and nix-darwin host. Nothing
#   is built and no secrets are needed, so it takes a minute or two.
# - Build (pushes to main, the weekly update-flake-lock PR, a PR labelled
#   `ci:build`, or a manual run): builds every host's system closure and pushes
#   the results to muninn's Attic cache via Tailscale OIDC. If muninn can't be
#   reached, or drops out mid-build, the jobs build locally instead (`--fallback`)
#   and skip the push.
#     - aarch64-darwin: magnus, darwintron (macos-26)
#     - x86_64-linux: muninn, fortuna, nixostron-x86_64 (ubuntu-latest)
#     - aarch64-linux: nixostron-aarch64, tenabrae (ubuntu-24.04-arm)
# - tenabrae's SD image (manual run with `tenabrae-sd-image` ticked): builds
#   the flashable image on ubuntu-24.04-arm and pushes it to Attic, so magnus
#   can fetch it without an aarch64-linux builder. See documentation/tenabrae.md.
#
# Pushes to main that only touch documentation skip the workflow entirely. PRs
# always run it, because the ruleset on main requires these checks: on a
# docs-only PR the `changes` job skips every other job, and GitHub counts a
# skipped required check as passing.
#
name: CI/CD Build

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "documentation/**"
      - "LICENSE"
  pull_request:
    # `labeled` lets adding `ci:build` start a full build of the PR
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      tenabrae-sd-image:
        description: Also build tenabrae's SD image and push it to Attic
        type: boolean
        default: false

# Every run evaluates, including one started by adding a label: the latest run's
# result is what the required checks see, so a run that skipped evaluation would
# turn a failed check into a passing (skipped) one. A newer run therefore
# replaces any run in progress for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Evaluate
  # ---------------------------------------------------------------------------

  # Whether a PR touches anything besides Markdown, documentation/ and LICENSE.
  # Pushes and manual runs always count as code changes.
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.detect.outputs.code }}
    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ "$EVENT" = pull_request ]; then
            # Assigned on its own line so a failing API call stops `bash -e`.
            files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
            code=false
            while IFS= read -r file; do
              case "$file" in
                *.md | documentation/* | LICENSE) ;;
                *)
                  code=true
                  break
                  ;;
              esac
            done <<<"$files"
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changes: $code"

  # NixOS hosts are evaluated on Linux; fortuna imports from a derivation
  # (zen-browser's presets), which needs a runner of the host's own system.
  # nixostron-aarch64 doesn't, so it evaluates fine on x86_64.
  eval-linux:
    name: Evaluate NixOS hosts, formatting and flake.nix
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        # Read access to the private amatos/secrets input (the `secrets` flake input).
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.SECRETS_REPO_TOKEN }}

      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 -r nix fmt -- --check

      - name: Check flake.nix is up to date (nix run .#write-flake)
        run: nix build --no-link .#checks.x86_64-linux.check-flake-file

      - name: Lint and test shell and Python scripts (test-scripts)
        run: nix build --no-link --print-build-logs .#checks.x86_64-linux.script-tests

      # Hosts are listed from the flake, so new ones are picked up automatically.
      - name: Evaluate NixOS hosts
        run: |
          # Listed into a variable first: a failing command substitution in a
          # `for` list doesn't stop `bash -e`, so an evaluation error would
          # leave nothing to loop over and the step would still pass.
          hosts_json=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames --accept-flake-config)
          hosts=$(jq -r '.[]' <<<"$hosts_json")
          if [ -z "$hosts" ]; then
            echo "::error::No hosts found in nixosConfigurations"
            exit 1
          fi
          for host in $hosts; do
            echo "::group::$host"
            nix eval --raw ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath" \
              --accept-flake-config
            echo
            echo "::endgroup::"
          done

  # magnus imports from a derivation (zen-browser's presets) built for
  # aarch64-darwin, so the darwin hosts can't be evaluated on Linux.
  eval-darwin:
    name: Evaluate nix-darwin hosts
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        # Read access to the private amatos/secrets input (the `secrets` flake input).
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.SECRETS_REPO_TOKEN }}

      # Also on macOS, where the scripts meet BSD tools.
      - name: Lint and test shell and Python scripts (test-scripts)
        run: nix build --no-link --print-build-logs .#checks.aarch64-darwin.script-tests

      - name: Evaluate nix-darwin hosts
        run: |
          # Listed into a variable first: a failing command substitution in a
          # `for` list doesn't stop `bash -e`, so an evaluation error would
          # leave nothing to loop over and the step would still pass.
          hosts_json=$(nix eval --json .#darwinConfigurations --apply builtins.attrNames --accept-flake-config)
          hosts=$(jq -r '.[]' <<<"$hosts_json")
          if [ -z "$hosts" ]; then
            echo "::error::No hosts found in darwinConfigurations"
            exit 1
          fi
          for host in $hosts; do
            echo "::group::$host"
            nix eval --raw ".#darwinConfigurations.$host.system.drvPath" \
              --accept-flake-config
            echo
            echo "::endgroup::"
          done

  # ---------------------------------------------------------------------------
  # Build
  # ---------------------------------------------------------------------------

  # Decides once whether the build jobs run, so the condition lives in one place.
  should-build:
    name: Decide whether to build
    needs: [eval-linux, eval-darwin]
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:build') }}
        run: |
          if [ "$EVENT" != pull_request ] || [ "$HEAD_REF" = update-flake-lock ] || [ "$HAS_LABEL" = true ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "Building: $EVENT, branch '$HEAD_REF', ci:build label: $HAS_LABEL"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "Evaluation only. Add the ci:build label to build this PR."
          fi

  build-darwin:
    name: Build darwin (aarch64-darwin)
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: macos-26
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v12
        # Read access to the private amatos/secrets input (the `secrets` flake input).
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.SECRETS_REPO_TOKEN }}

      # Optional: if muninn is unreachable the job builds without the cache.
      - name: Use muninn's Attic cache
        id: attic
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build magnus
        run: |
          nix build .#darwinConfigurations.magnus.system \
            --out-link result-magnus \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build darwintron
        run: |
          nix build .#darwinConfigurations.darwintron.system \
            --out-link result-darwintron \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Push to Attic cache
        if: always() && steps.attic.outcome == 'success'
        run: attic push magnanix result-* || true

  build-linux-x86:
    name: Build linux (x86_64-linux)
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        # Read access to the private amatos/secrets input (the `secrets` flake input).
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.SECRETS_REPO_TOKEN }}

      # Optional: if muninn is unreachable the job builds without the cache.
      - name: Use muninn's Attic cache
        id: attic
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build muninn
        run: |
          nix build .#nixosConfigurations.muninn.config.system.build.toplevel \
            --out-link result-muninn \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build fortuna
        run: |
          nix build .#nixosConfigurations.fortuna.config.system.build.toplevel \
            --out-link result-fortuna \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build nixostron-x86_64
        run: |
          nix build .#nixosConfigurations.nixostron-x86_64.config.system.build.toplevel \
            --out-link result-nixostron-x86_64 \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Push to Attic cache
        if: always() && steps.attic.outcome == 'success'
        run: attic push magnanix result-* || true

  build-linux-aarch64:
    name: Build linux (aarch64-linux)
    needs: should-build
    if: needs.should-build.outputs.build == 'true'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        # Read access to the private amatos/secrets input (the `secrets` flake input).
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.SECRETS_REPO_TOKEN }}

      # Optional: if muninn is unreachable the job builds without the cache.
      - name: Use muninn's Attic cache
        id: attic
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build nixostron-aarch64
        run: |
          nix build .#nixosConfigurations.nixostron-aarch64.config.system.build.toplevel \
            --out-link result-nixostron-aarch64 \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Build tenabrae
        run: |
          nix build .#nixosConfigurations.tenabrae.config.system.build.toplevel \
            --out-link result-tenabrae \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      # Only on request: the image holds the whole closure, so pushing one on
      # every run would fill the cache.
      - name: Build tenabrae SD image
        if: github.event_name == 'workflow_dispatch' && inputs.tenabrae-sd-image
        run: |
          nix build .#nixosConfigurations.tenabrae.config.system.build.sdImage \
            --out-link result-tenabrae-sd-image \
            --accept-flake-config \
            --max-jobs auto \
            --fallback

      - name: Push to Attic cache
        if: always() && steps.attic.outcome == 'success'
        run: attic push magnanix result-* || true
