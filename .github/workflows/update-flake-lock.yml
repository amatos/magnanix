# Weekly flake input update
#
# Automatically updates flake.lock and regenerates flake.nix every Saturday.
# Opens a pull request for review before merging.
#
# Uses Tailscale OIDC to authenticate with muninn's Attic cache on
# muninn.ts.matos.cc:8080. Requires Tailscale ACL to permit tag:ci -> muninn:8080.
#
# Note: Pull requests opened with the default GITHUB_TOKEN don't trigger other
# workflows. Add a fine-grained token with Contents and Pull requests
# read/write on this repo as the GH_TOKEN_FOR_UPDATES secret so CI runs on the
# PR; without it the PR is still opened, but CI only runs after you close and
# reopen it.
#
name: Update flake inputs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 6" # Saturdays 06:00 UTC, leaving the weekend to test it

permissions:
  contents: write
  pull-requests: write
  id-token: write # Required for Tailscale Workload Identity Federation

concurrency:
  group: update-flake-lock
  cancel-in-progress: false

# An explicit `bash` runs steps with `-eo pipefail`, so a failing
# `nix flake update` isn't hidden by `tee`.
defaults:
  run:
    shell: bash

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        # Read access to the private amatos/secrets input (the `secrets` flake input).
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.SECRETS_REPO_TOKEN }}

      # The cache only speeds up `write-flake`; the update works without it.
      - name: Use muninn's Attic cache
        continue-on-error: true
        uses: ./.github/actions/attic-cache
        with:
          ts-oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          ts-audience: ${{ secrets.TS_AUDIENCE }}
          attic-token: ${{ secrets.ATTIC_TOKEN }}

      # nix-secrets is pinned to a release tag (modules/den/_versions.nix), which
      # `nix flake update` never moves. Stable tags only (vX.Y.Z), so release
      # candidates are skipped. Runs first, so the lock and write-flake see the new tag.
      - name: Bump nix-secrets to its latest release tag
        id: nix-secrets
        run: |
          file=modules/den/_versions.nix
          old=$(sed -nE 's/^ *nix-secrets = "(v[0-9]+\.[0-9]+\.[0-9]+)";.*/\1/p' "$file")
          # Assigned on their own lines so a failing command stops `bash -e`.
          tags=$(git ls-remote --tags --refs https://github.com/unnamed-systems/nix-secrets)
          # shellcheck disable=SC2001 # strips a prefix from every line, not one variable
          new=$(sed 's|.*refs/tags/||' <<<"$tags" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          [ -n "$old" ] && [ -n "$new" ] || { echo "::error::could not read the nix-secrets tags"; exit 1; }
          sed -i -E "s/^( *nix-secrets = \")v[0-9]+\.[0-9]+\.[0-9]+(\";)/\1$new\2/" "$file"
          echo "old=$old" >> "$GITHUB_OUTPUT"
          echo "new=$new" >> "$GITHUB_OUTPUT"
          echo "nix-secrets: $old -> $new"

      - name: Update flake.lock
        run: nix flake update 2>&1 | tee "$RUNNER_TEMP/update.log"

      # flake.nix is generated: write-flake rewrites it from the modules and
      # adds `follows` for nested inputs found in the new lock.
      - name: Regenerate flake.nix
        run: nix run .#write-flake

      - name: Write the pull request body
        run: |
          # Single quotes keep the Markdown backticks literal.
          # shellcheck disable=SC2016
          {
            echo 'Automated `nix flake update`, followed by `nix run .#write-flake`.'
            echo
            echo '```'
            grep -v '^warning: updating lock file' "$RUNNER_TEMP/update.log" || true
            echo '```'
            echo
            echo 'Before merging:'
            echo
            echo '- [ ] CI evaluates and builds every host (this branch always gets a full build)'
            echo '- [ ] `darwintron-vm test update-flake-lock` passes on magnus'
            if [ "${{ steps.nix-secrets.outputs.old }}" != "${{ steps.nix-secrets.outputs.new }}" ]; then
              echo
              echo 'nix-secrets: `${{ steps.nix-secrets.outputs.old }}` → `${{ steps.nix-secrets.outputs.new }}`'
              echo "([changes](https://github.com/unnamed-systems/nix-secrets/compare/${{ steps.nix-secrets.outputs.old }}...${{ steps.nix-secrets.outputs.new }}))"
              echo
              echo '- [ ] Read the nix-secrets changes; on a minor bump also run `nixostron-vm test update-flake-lock`'
              echo '- [ ] If `darwintron-vm test` fails to build the nix-secrets patch, upstream may have fixed #9: see D8 in documentation/NIX_SECRETS_PLAN.md'
            fi
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GH_TOKEN_FOR_UPDATES || github.token }}
          branch: update-flake-lock
          delete-branch: true
          add-paths: |
            flake.lock
            flake.nix
            modules/den/_versions.nix
          commit-message: "chore(flake): update inputs"
          title: "chore(flake): update inputs"
          body-path: ${{ runner.temp }}/pr-body.md
